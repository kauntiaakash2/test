<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ec4899">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Mahila Saathi - Women's Safety and Support Application">
  <link rel="manifest" href="#" id="manifest-placeholder">
  <title>Mahila Saathi - Women's Safety App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    body {
      overscroll-behavior: none;
      position: fixed;
      width: 100%;
      height: 100%;
      overflow: hidden;
      margin: 0;
    }
    .animate-pulse {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }
    .install-prompt {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      animation: slideUp 0.3s ease-out;
    }
    @keyframes slideUp {
      from { transform: translate(-50%, 100px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }
  </style>
</head>
<body class="bg-white">
  <div id="app" class="w-full h-screen max-w-md mx-auto bg-white relative overflow-hidden"></div>

  <script>
    // ------------------ SERVICE WORKER ------------------
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'mahila-saathi-v1';
        const urlsToCache = ['/'];

        self.addEventListener('install', event => {
          event.waitUntil(
            caches.open(CACHE_NAME).then(cache => cache.addAll(urlsToCache))
          );
        });

        self.addEventListener('fetch', event => {
          event.respondWith(
            caches.match(event.request).then(response => response || fetch(event.request))
          );
        });
      `;

      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);

      navigator.serviceWorker.register(swUrl).then(reg => {
        console.log('Service Worker registered');
      }).catch(err => {
        console.log('Service Worker registration failed:', err);
      });
    }

    // ------------------ WEB APP MANIFEST ------------------
    const manifest = {
      name: "Mahila Saathi - Women's Safety",
      short_name: "Mahila Saathi",
      description: "Women's Safety and Support Application",
      start_url: "/",
      display: "standalone",
      background_color: "#ffffff",
      theme_color: "#ec4899",
      orientation: "portrait",
      icons: [
        {
          src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23ec4899'/%3E%3Cpath d='M50 25 L35 45 L45 45 L45 65 L55 65 L55 45 L65 45 Z' fill='white'/%3E%3C/svg%3E",
          sizes: "192x192",
          type: "image/svg+xml"
        },
        {
          src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23ec4899'/%3E%3Cpath d='M50 25 L35 45 L45 45 L45 65 L55 65 L55 45 L65 45 Z' fill='white'/%3E%3C/svg%3E",
          sizes: "512x512",
          type: "image/svg+xml"
        }
      ]
    };

    const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    const manifestURL = URL.createObjectURL(manifestBlob);
    document.getElementById('manifest-placeholder').setAttribute('href', manifestURL);

    // ------------------ APP STATE (GLOBAL) ------------------
    window.state = {
      activeScreen: 'home',
      emergencyContacts: [
        { id: 1, name: 'Police', number: '100', type: 'emergency' },
        { id: 2, name: 'Women Helpline', number: '1091', type: 'emergency' },
        { id: 3, name: 'Ambulance', number: '102', type: 'emergency' },
        { id: 4, name: 'Domestic Violence', number: '181', type: 'emergency' }
      ],
      complaints: [],
      newComplaint: { title: '', description: '', category: 'harassment' },
      sosActive: false,
      sosCountdown: 5,
      currentLocation: null,
      showMenu: false,
      notifications: [
        { id: 1, title: 'Safety Alert', message: 'High crime area nearby', time: '2 hours ago' },
        { id: 2, title: 'Complaint Update', message: 'Your complaint is being reviewed', time: '5 hours ago' }
      ],
      deferredPrompt: null,
      showInstallPrompt: false
    };

    let sosInterval = null;

    // ------------------ ICONS ------------------
    const icons = {
      shield: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>',
      bell: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>',
      menu: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>',
      users: '<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>',
      mapPin: '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>',
      alert: '<svg class="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>',
      phone: '<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>',
      navigation: '<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>',
      fileText: '<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>',
      home: '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>',
      chevronLeft: '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>',
      x: '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>',
      settings: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>',
      help: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>',
      info: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>',
      clock: '<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>',
      camera: '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>',
      mic: '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>'
    };

    // ------------------ PWA INSTALL PROMPT ------------------
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      state.deferredPrompt = e;
      state.showInstallPrompt = true;
      render();
    });

    function installApp() {
      if (state.deferredPrompt) {
        state.deferredPrompt.prompt();
        state.deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('App installed');
          }
          state.deferredPrompt = null;
          state.showInstallPrompt = false;
          render();
        });
      }
    }
    window.installApp = installApp;

    // ------------------ LOCATION ------------------
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (position) => {
          state.currentLocation = {
            lat: position.coords.latitude,
            lng: position.coords.longitude
          };
          render();
        },
        (error) => console.log('Location access denied')
      );
    }

    // ------------------ SOS ------------------
    function startSOSCountdown() {
      state.sosActive = true;
      state.sosCountdown = 5;
      render();

      if (navigator.vibrate) {
        navigator.vibrate([200, 100, 200]);
      }

      sosInterval = setInterval(() => {
        state.sosCountdown--;
        render();

        if (state.sosCountdown === 0) {
          clearInterval(sosInterval);
          alert('🚨 SOS ALERT SENT!\\n\\n✓ Emergency contacts notified\\n✓ Location shared with authorities\\n✓ Audio recording started');
          state.sosActive = false;
          state.sosCountdown = 5;
          render();
        }
      }, 1000);
    }
    window.startSOSCountdown = startSOSCountdown;

    function cancelSOS() {
      clearInterval(sosInterval);
      state.sosActive = false;
      state.sosCountdown = 5;
      render();
    }
    window.cancelSOS = cancelSOS;

    // ------------------ COMPLAINTS ------------------
    function handleComplaintSubmit() {
      const titleEl = document.getElementById('complaint-title');
      const descEl = document.getElementById('complaint-description');
      const catEl = document.getElementById('complaint-category');

      const title = titleEl.value.trim();
      const description = descEl.value.trim();
      const category = catEl.value;

      if (title && description) {
        const complaint = {
          id: Date.now(),
          title,
          description,
          category,
          date: new Date().toLocaleDateString(),
          time: new Date().toLocaleTimeString(),
          status: 'pending'
        };
        state.complaints.unshift(complaint);

        titleEl.value = '';
        descEl.value = '';
        catEl.value = 'harassment';

        alert('✓ Complaint submitted successfully!');
        state.activeScreen = 'complaints-list';
        render();
      } else {
        alert('Please fill in all required fields');
      }
    }
    window.handleComplaintSubmit = handleComplaintSubmit;

    // ------------------ CONTACTS & LOCATION SHARE ------------------
    function addContact() {
      const name = prompt('Enter contact name:');
      if (!name) return;
      const number = prompt('Enter contact number:');
      if (!number) return;

      state.emergencyContacts.push({
        id: Date.now(),
        name,
        number,
        type: 'personal'
      });
      render();
    }
    window.addContact = addContact;

    function shareLocation() {
      if (state.currentLocation) {
        const lat = state.currentLocation.lat.toFixed(6);
        const lng = state.currentLocation.lng.toFixed(6);
        alert('📍 Location shared!\\n\\nLat: ' + lat + '\\nLng: ' + lng + '\\n\\nSharing with emergency contacts...');
      } else {
        alert('Location not available. Please enable GPS.');
      }
    }
    window.shareLocation = shareLocation;

    // ------------------ UI HELPERS ------------------
    function renderInstallPrompt() {
      if (!state.showInstallPrompt) return '';
      return `
        <div class="install-prompt bg-pink-600 text-white px-6 py-4 rounded-2xl shadow-2xl max-w-sm mx-4">
          <div class="flex items-center justify-between gap-4">
            <div class="flex-1">
              <h3 class="font-bold mb-1">Install Mahila Saathi</h3>
              <p class="text-xs text-pink-100">Install app for quick access</p>
            </div>
            <button onclick="installApp()" class="bg-white text-pink-600 px-4 py-2 rounded-lg font-semibold text-sm whitespace-nowrap">
              Install
            </button>
          </div>
        </div>
      `;
    }

    function renderTopBar(title) {
      return `
        <div class="bg-pink-600 text-white px-4 py-3 flex items-center justify-between">
          <button onclick="state.activeScreen='home'; state.showMenu=false; render();" class="flex items-center gap-1">
            ${icons.chevronLeft}
            <span class="text-sm">Back</span>
          </button>
          <span class="font-semibold">${title}</span>
          <span class="w-6"></span>
        </div>
      `;
    }

    function renderBottomNav(active) {
      return `
        <div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white border-t border-gray-200 px-2 py-2 flex justify-around">
          <button onclick="state.activeScreen='home'; render();" class="flex flex-col items-center text-xs ${active==='home'?'text-pink-600':'text-gray-500'}">
            ${icons.home}
            <span>Home</span>
          </button>
          <button onclick="state.activeScreen='contacts'; render();" class="flex flex-col items-center text-xs ${active==='contacts'?'text-pink-600':'text-gray-500'}">
            ${icons.phone}
            <span>Contacts</span>
          </button>
          <button onclick="state.activeScreen='complaint'; render();" class="flex flex-col items-center text-xs ${active==='complaint' || active==='complaints-list' ? 'text-pink-600':'text-gray-500'}">
            ${icons.fileText}
            <span>Complaint</span>
          </button>
          <button onclick="state.activeScreen='safety'; render();" class="flex flex-col items-center text-xs ${active==='safety'?'text-pink-600':'text-gray-500'}">
            ${icons.shield}
            <span>Safety</span>
          </button>
        </div>
      `;
    }

    function renderMenu() {
      if (!state.showMenu) return '';
      return `
        <div class="absolute top-12 right-4 bg-white rounded-xl shadow-xl z-20 w-44 border border-gray-100">
          <button onclick="state.activeScreen='about'; state.showMenu=false; render();" class="w-full flex items-center gap-2 px-4 py-2 text-sm hover:bg-gray-50">
            ${icons.info}
            <span>About App</span>
          </button>
          <button onclick="state.activeScreen='help'; state.showMenu=false; render();" class="w-full flex items-center gap-2 px-4 py-2 text-sm hover:bg-gray-50">
            ${icons.help}
            <span>Help</span>
          </button>
          <button onclick="state.activeScreen='settings'; state.showMenu=false; render();" class="w-full flex items-center gap-2 px-4 py-2 text-sm hover:bg-gray-50">
            ${icons.settings}
            <span>Settings</span>
          </button>
        </div>
      `;
    }

    // ------------------ SCREENS ------------------
    function renderHomeScreen() {
      return `
        <div class="flex flex-col h-full bg-gradient-to-b from-pink-50 to-white relative">
          <div class="bg-pink-600 text-white px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2">
              ${icons.shield}
              <span class="font-semibold">Mahila Saathi</span>
            </div>
            <div class="flex items-center gap-3">
              <button onclick="state.activeScreen='notifications'; render();" class="relative">
                ${icons.bell}
                ${state.notifications.length > 0 ? `<span class="absolute -top-1 -right-1 bg-red-500 text-xs w-4 h-4 rounded-full flex items-center justify-center">${state.notifications.length}</span>` : ''}
              </button>
              <button onclick="state.showMenu=!state.showMenu; render();">
                ${icons.menu}
              </button>
            </div>
          </div>

          ${renderMenu()}

          <div class="p-4">
            <div class="bg-gradient-to-r from-pink-500 to-purple-600 rounded-2xl p-6 text-white shadow-lg">
              <div class="flex items-center gap-4 mb-4">
                <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center">
                  ${icons.users}
                </div>
                <div>
                  <h2 class="text-xl font-bold">Welcome Back!</h2>
                  <p class="text-pink-100 text-sm">Stay safe, stay empowered</p>
                </div>
              </div>
              <div class="flex items-center gap-2 text-sm">
                ${icons.mapPin}
                <span>${state.currentLocation ? 'Location detected' : 'Bhubaneswar, Odisha'}</span>
              </div>
            </div>
          </div>

          <div class="px-4 mb-4">
            <button onclick="${state.sosActive ? 'cancelSOS()' : 'startSOSCountdown()'}" class="w-full ${state.sosActive ? 'bg-red-700 animate-pulse' : 'bg-red-600'} text-white rounded-2xl py-8 shadow-xl transition-all active:scale-95">
              ${icons.alert}
              <h3 class="text-3xl font-bold mt-3">
                ${state.sosActive ? 'SENDING IN ' + state.sosCountdown + 's' : 'EMERGENCY SOS'}
              </h3>
              <p class="text-sm mt-2 text-red-100">
                ${state.sosActive ? 'Tap to cancel' : 'Press for emergency'}
              </p>
            </button>
          </div>

          <div class="px-4 pb-20">
            <h3 class="font-semibold text-gray-800 mb-3">Quick Actions</h3>
            <div class="grid grid-cols-2 gap-3">
              <button onclick="state.activeScreen='contacts'; render();" class="bg-white rounded-xl p-4 shadow-md active:scale-95 transition-transform">
                ${icons.phone}
                <p class="font-semibold text-gray-800 text-sm mt-2">Emergency Call</p>
                <p class="text-xs text-gray-500">Quick dial</p>
              </button>

              <button onclick="shareLocation()" class="bg-white rounded-xl p-4 shadow-md active:scale-95 transition-transform">
                ${icons.navigation}
                <p class="font-semibold text-gray-800 text-sm mt-2">Share Location</p>
                <p class="text-xs text-gray-500">Live tracking</p>
              </button>

              <button onclick="state.activeScreen='complaint'; render();" class="bg-white rounded-xl p-4 shadow-md active:scale-95 transition-transform">
                ${icons.fileText}
                <p class="font-semibold text-gray-800 text-sm mt-2">File Complaint</p>
                <p class="text-xs text-gray-500">Report incident</p>
              </button>

              <button onclick="state.activeScreen='safety'; render();" class="bg-white rounded-xl p-4 shadow-md active:scale-95 transition-transform">
                ${icons.shield}
                <p class="font-semibold text-gray-800 text-sm mt-2">Safety Tips</p>
                <p class="text-xs text-gray-500">Learn more</p>
              </button>
            </div>
          </div>

          ${renderBottomNav('home')}
        </div>
      `;
    }

    function renderContactsScreen() {
      return `
        <div class="flex flex-col h-full bg-gray-50">
          ${renderTopBar('Emergency Contacts')}

          <div class="flex-1 overflow-y-auto px-4 py-4 pb-20">
            <button onclick="addContact()" class="w-full bg-pink-600 text-white rounded-xl py-3 mb-4 font-semibold flex items-center justify-center gap-2">
              ${icons.users}
              Add New Contact
            </button>

            <div class="space-y-3">
              ${state.emergencyContacts.map(contact => `
                <div class="bg-white rounded-xl p-4 shadow-md">
                  <div class="flex items-center justify-between">
                    <div class="flex-1">
                      <h3 class="font-semibold text-gray-800">${contact.name}</h3>
                      <p class="text-gray-600 text-sm">${contact.number}</p>
                      <span class="inline-block mt-2 text-xs px-2 py-1 rounded-full ${contact.type === 'emergency' ? 'bg-red-100 text-red-600' : 'bg-blue-100 text-blue-600'}">
                        ${contact.type === 'emergency' ? 'Emergency' : 'Personal'}
                      </span>
                    </div>
                    <a href="tel:${contact.number}" class="bg-green-500 text-white p-4 rounded-full shadow-lg active:scale-95 transition-transform">
                      ${icons.phone}
                    </a>
                  </div>
                </div>
              `).join('')}
            </div>

            <div class="mt-6 bg-gradient-to-r from-purple-100 to-pink-100 rounded-xl p-4">
              <h3 class="font-semibold mb-2 text-gray-800">📞 National Helplines</h3>
              <div class="space-y-1 text-sm text-gray-700">
                <p>• Women Helpline: 1091</p>
                <p>• Police: 100</p>
                <p>• Child Helpline: 1098</p>
                <p>• Senior Citizen: 1091</p>
                <p>• Disaster Management: 108</p>
              </div>
            </div>
          </div>

          ${renderBottomNav('contacts')}
        </div>
      `;
    }

    function renderSafetyScreen() {
      return `
        <div class="flex flex-col h-full bg-gray-50">
          ${renderTopBar('Safety Tips')}

          <div class="flex-1 overflow-y-auto px-4 py-4 pb-20 space-y-4">
            <div class="bg-white rounded-xl p-4 shadow-md">
              <h3 class="font-semibold text-gray-800 mb-2">👣 While Travelling</h3>
              <ul class="list-disc list-inside text-sm text-gray-700 space-y-1">
                <li>Share your live location with a trusted contact.</li>
                <li>Avoid using headphones at high volume in unknown areas.</li>
                <li>Note vehicle number and share if you feel unsafe.</li>
                <li>Sit near other women or families when possible.</li>
              </ul>
            </div>

            <div class="bg-white rounded-xl p-4 shadow-md">
              <h3 class="font-semibold text-gray-800 mb-2">🏠 At Home / Hostel</h3>
              <ul class="list-disc list-inside text-sm text-gray-700 space-y-1">
                <li>Do not open the door to unknown visitors without verification.</li>
                <li>Keep emergency numbers saved and visible near the door.</li>
                <li>Inform a trusted person if someone behaves suspiciously.</li>
              </ul>
            </div>

            <div class="bg-white rounded-xl p-4 shadow-md">
              <h3 class="font-semibold text-gray-800 mb-2">🌐 Online Safety</h3>
              <ul class="list-disc list-inside text-sm text-gray-700 space-y-1">
                <li>Do not share OTP, passwords or private photos with anyone.</li>
                <li>Use strong passwords and enable two-factor authentication.</li>
                <li>Block and report abusive or threatening messages.</li>
              </ul>
            </div>

            <div class="bg-pink-50 rounded-xl p-4 border border-pink-100">
              <h3 class="font-semibold text-gray-800 mb-2">🚨 In Case of Emergency</h3>
              <ol class="list-decimal list-inside text-sm text-gray-700 space-y-1">
                <li>Press the <span class="font-semibold text-red-600">SOS button</span> on the home screen.</li>
                <li>Call nearest emergency number (100 / 1091 / 181).</li>
                <li>Move to a crowded and well-lit place if possible.</li>
              </ol>
            </div>
          </div>

          ${renderBottomNav('safety')}
        </div>
      `;
    }

    function renderComplaintFormScreen() {
      return `
        <div class="flex flex-col h-full bg-gray-50">
          ${renderTopBar('File Complaint')}

          <div class="flex-1 overflow-y-auto px-4 py-4 pb-20">
            <div class="bg-white rounded-xl p-4 shadow-md space-y-3">
              <div>
                <label class="text-sm font-semibold text-gray-700">Title *</label>
                <input id="complaint-title" class="mt-1 w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-pink-400" placeholder="Short title of incident">
              </div>

              <div>
                <label class="text-sm font-semibold text-gray-700">Category</label>
                <select id="complaint-category" class="mt-1 w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-pink-400">
                  <option value="harassment">Harassment</option>
                  <option value="domestic-violence">Domestic Violence</option>
                  <option value="cyber-crime">Cyber Crime</option>
                  <option value="stalking">Stalking</option>
                  <option value="other">Other</option>
                </select>
              </div>

              <div>
                <label class="text-sm font-semibold text-gray-700">Description *</label>
                <textarea id="complaint-description" rows="4" class="mt-1 w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-pink-400" placeholder="Describe what happened, when and where."></textarea>
              </div>

              <div class="flex items-center gap-3 text-xs text-gray-500">
                <span class="inline-flex items-center gap-1">
                  ${icons.camera}
                  Add photos (optional)
                </span>
                <span class="inline-flex items-center gap-1">
                  ${icons.mic}
                  Voice note (future)
                </span>
              </div>

              <button onclick="handleComplaintSubmit()" class="w-full bg-pink-600 text-white rounded-xl py-3 font-semibold mt-2 active:scale-95 transition-transform">
                Submit Complaint
              </button>
            </div>

            <button onclick="state.activeScreen='complaints-list'; render();" class="mt-4 w-full text-center text-sm text-pink-600">
              View previous complaints →
            </button>
          </div>

          ${renderBottomNav('complaint')}
        </div>
      `;
    }

    function renderComplaintsListScreen() {
      return `
        <div class="flex flex-col h-full bg-gray-50">
          ${renderTopBar('My Complaints')}

          <div class="flex-1 overflow-y-auto px-4 py-4 pb-20">
            ${state.complaints.length === 0 ? `
              <div class="bg-white rounded-xl p-4 shadow-md text-center text-sm text-gray-600">
                No complaints yet. You can file one from the <span class="font-semibold">File Complaint</span> screen.
              </div>
            ` : `
              <div class="space-y-3">
                ${state.complaints.map(c => `
                  <div class="bg-white rounded-xl p-4 shadow-md">
                    <div class="flex items-start justify-between gap-2">
                      <div>
                        <h3 class="font-semibold text-gray-800">${c.title}</h3>
                        <p class="text-xs text-gray-500 mt-1">${c.date} • ${c.time}</p>
                        <p class="mt-2 text-sm text-gray-700">${c.description}</p>
                      </div>
                      <span class="text-xs px-2 py-1 rounded-full ${c.status === 'pending' ? 'bg-yellow-100 text-yellow-700' : 'bg-green-100 text-green-700'}">
                        ${c.status === 'pending' ? 'Pending' : 'Resolved'}
                      </span>
                    </div>
                    <div class="mt-2 text-xs text-gray-500">
                      Category: <span class="font-medium">${c.category}</span>
                    </div>
                  </div>
                `).join('')}
              </div>
            `}
          </div>

          ${renderBottomNav('complaint')}
        </div>
      `;
    }

    function renderNotificationsScreen() {
      return `
        <div class="flex flex-col h-full bg-gray-50">
          ${renderTopBar('Notifications')}

          <div class="flex-1 overflow-y-auto px-4 py-4 pb-20">
            ${state.notifications.length === 0 ? `
              <div class="bg-white rounded-xl p-4 shadow-md text-center text-sm text-gray-600">
                No new notifications.
              </div>
            ` : `
              <div class="space-y-3">
                ${state.notifications.map(n => `
                  <div class="bg-white rounded-xl p-4 shadow-md flex gap-3">
                    <div class="mt-1 text-pink-600">
                      ${icons.bell}
                    </div>
                    <div class="flex-1">
                      <h3 class="font-semibold text-gray-800">${n.title}</h3>
                      <p class="text-sm text-gray-700 mt-1">${n.message}</p>
                      <div class="flex items-center gap-1 text-xs text-gray-500 mt-2">
                        ${icons.clock}
                        <span>${n.time}</span>
                      </div>
                    </div>
                  </div>
                `).join('')}
              </div>
            `}
          </div>

          ${renderBottomNav('home')}
        </div>
      `;
    }

    function renderSimpleInfoScreen(title, contentHtml) {
      return `
        <div class="flex flex-col h-full bg-gray-50">
          ${renderTopBar(title)}
          <div class="flex-1 overflow-y-auto px-4 py-4 pb-20">
            <div class="bg-white rounded-xl p-4 shadow-md text-sm text-gray-700 space-y-2">
              ${contentHtml}
            </div>
          </div>
          ${renderBottomNav('home')}
        </div>
      `;
    }

    // ------------------ MAIN RENDER FUNCTION ------------------
    function render() {
      let screenHtml = '';

      switch (state.activeScreen) {
        case 'home':
          screenHtml = renderHomeScreen();
          break;
        case 'contacts':
          screenHtml = renderContactsScreen();
          break;
        case 'safety':
          screenHtml = renderSafetyScreen();
          break;
        case 'complaint':
          screenHtml = renderComplaintFormScreen();
          break;
        case 'complaints-list':
          screenHtml = renderComplaintsListScreen();
          break;
        case 'notifications':
          screenHtml = renderNotificationsScreen();
          break;
        case 'about':
          screenHtml = renderSimpleInfoScreen('About Mahila Saathi', `
            <p><strong>Mahila Saathi</strong> is a women&apos;s safety and support application concept that helps users quickly reach emergency contacts, share location, and record incidents.</p>
            <p>This is an educational/demo app. For real emergencies, always contact official helplines and local authorities.</p>
          `);
          break;
        case 'help':
          screenHtml = renderSimpleInfoScreen('Help & Support', `
            <p>• Use the <strong>SOS button</strong> on the home screen in case of emergency.</p>
            <p>• Add trusted contacts in the <strong>Emergency Contacts</strong> section.</p>
            <p>• File complaints from the <strong>File Complaint</strong> screen.</p>
          `);
          break;
        case 'settings':
          screenHtml = renderSimpleInfoScreen('Settings', `
            <p>Future settings like dark mode, language and notification preferences can be added here.</p>
          `);
          break;
        default:
          screenHtml = renderHomeScreen();
      }

      document.getElementById('app').innerHTML = screenHtml + renderInstallPrompt();
    }
    window.render = render;

    // Initial render
    render();
  </script>
</body>
</html>
